<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee House</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <img src="https://download.logo.wine/logo/Starbucks/Starbucks-Logo.wine.png" alt="">
        </div>

        <ul>
          <li><a href="">Home</a></li>
          <li><a href="">Menu</a></li>
          <li><a href="">Reward</a></li>
          <li><a href="">Gift Cards</a></li>
        </ul>


        <div class="buttons">
          <a href=""><i class="fa-solid fa-location-dot"></i>Find Store</a>
          <button class="signin">Sign In</button>
          <button class="join">Join Now</button>
        </div>
      </nav>
    </div>
  </header>

  <section class="hero">

    <div class="container hero-content">
      <div class="left">
        <h1>It's not just <span>Coffee</span></h1>
        <p>
          Enjoy premium handcrafted coffee made with love.
          Experience freshness, aroma and happiness in every cup.
        </p>
        <button>Learn More</button>
      </div>

      <div class="right">
        <img src="https://m.media-amazon.com/images/I/515QZV8blhL.jpg" alt="">
      </div>

    </div>
  </section>
<section class="featured">
  <div class="container">
    <div class="drinks">
       <h4>Our Special Drinks</h4>
    </div>
    <div class="cards">
      <div class="card">
        <div class="img">
          <img src="https://images.pexels.com/photos/10828396/pexels-photo-10828396.jpeg" alt="Latte">
        </div>
      </div>
      <div class="card">
        
      </div>
      <div class="card">
        
      </div>
    </div>
  </div>
</section>
</body>
