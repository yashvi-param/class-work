<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table tag</title>

     <style>
        table,
        th,
        td,
        tr {
            border: 2px black;
            border-style: solid;
        }
    </style>
</head>
<body>
    <table>
        <caption>
            Table caption
        </caption>

        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Age</th>
                <th>Class</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>John Doe</td>
                <td>20</td>
                <td>CS101</td>
                <td>A</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jane Smith</td>
                <td>22</td>
                <td>CS102</td>
                <td>B+</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Emily Johnson</td>
                <td>19</td>
                <td>CS101</td>
                <td>A-</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Michael Brown</td>
                <td>21</td>
                <td>CS102</td>
                <td>B</td>
            </tr>
        </tbody>



    </table>
</body>
</html>
