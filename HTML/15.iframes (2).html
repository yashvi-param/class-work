<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframes</title>
</head>
<body>
    <h1>Embedded Map</h1>
    <div class="map-wrapper">
        <iframe
            src="https://www.google.com/maps?q=Bhavnagar,India&z=13&output=embed"
            allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>
    <p>Open in Google Maps: <a href="https://www.google.com/maps?q=Bhavnagar,India" target="_blank" rel="noopener">Bhavnagar, India</a></p>
     <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/GJKsRRX3v1Q?si=H7hTanv_SJOL0LAS"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
</body>
</html>
