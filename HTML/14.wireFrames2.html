<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframes</title>
    <style>
        header{
            border: 1px solid gray;
        }
        nav{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        ul{
            display: flex;
            gap: 50px;
        }
        li{
            list-style: none;
        }
        main{
            display: flex;
        }
        aside{
            height: 800px;
            width: 300px;
            border:2px solid gray;
        }
        section{
            text-align: center;
            height: 800px;
            width: 1600px;
            border: 1px solid gray;
        }
        footer{
            text-align: center;
            border: 1px solid gray;
            height: 50px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>logo</h1>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Service</li>
                <li>Contact</li>
                <li>Help</li>
            </ul>
        </nav>
    </header>
    <main>
        <aside>sidebar</aside>
        <section>this is home section</section>
    </main>
    <footer>this is footer section</footer>
</body>
</html>
